<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>果了个果 · 水果萌宠三消</title>
<meta name="description" content="果了个果：卡通水果萌宠堆叠三消小游戏，点牌入槽、三张同图案即消除，槽满 7 格失败。两关经典 + 无限模式。">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='37' r='18' fill='%23f2503f'/%3E%3Cpath d='M32 19l-9 4 6 4-6 2 9 2 9-2-6-2 6-4z' fill='%234caf50'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 牌面图标为 AI 生成位图，见 assets/pat/；此处原有内联 SVG sprite 已移除 -->

<div id="app">

  <!-- 首页 -->
  <section id="screen-home" class="screen active">
    <div class="home-inner">
      <div class="logo">
        <div class="logo-tiles">
          <span class="lt"><img src="assets/pat/carrot.png" alt="" draggable="false"></span>
          <span class="lt"><img src="assets/pat/sheep.png" alt="" draggable="false"></span>
          <span class="lt"><img src="assets/pat/strawberry.png" alt="" draggable="false"></span>
        </div>
        <h1>果了个果</h1>
        <p class="sub">水果萌宠 · 堆叠三消</p>
      </div>

      <div class="level-list" id="levelList"></div>

      <div class="home-foot">
        <div class="best" id="homeBest"></div>
        <button class="ghost" id="btnSound">🔊 音效开</button>
      </div>
    </div>
  </section>

  <!-- 对局 -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <button class="icon-btn" id="btnBack" aria-label="返回">‹</button>
      <div class="hud-mid">
        <div class="hud-level" id="hudLevel">第 1 关</div>
        <div class="hud-sub"><span id="hudTime">0:00</span><span class="dot">·</span><span id="hudLeft">剩 0 张</span></div>
      </div>
      <button class="icon-btn" id="btnMute" aria-label="音效">🔊</button>
    </div>

    <div class="stage-wrap" id="stageWrap">
      <div class="board" id="board"></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="props" id="props">
      <button class="prop" data-prop="undo">
        <span class="pi">↺</span><span class="pn">撤销</span><span class="pc" id="cnt-undo">0</span>
      </button>
      <button class="prop" data-prop="move">
        <span class="pi">⇥</span><span class="pn">移出</span><span class="pc" id="cnt-move">0</span>
      </button>
      <button class="prop" data-prop="shuffle">
        <span class="pi">⤨</span><span class="pn">洗牌</span><span class="pc" id="cnt-shuffle">0</span>
      </button>
    </div>

    <div class="dock">
      <div class="tray" id="tray">
        <div class="tray-cell" data-cell="0"></div>
        <div class="tray-cell" data-cell="1"></div>
        <div class="tray-cell" data-cell="2"></div>
        <div class="tray-tag">暂存</div>
      </div>
      <div class="slot" id="slot">
        <div class="slot-cell" data-cell="0"></div>
        <div class="slot-cell" data-cell="1"></div>
        <div class="slot-cell" data-cell="2"></div>
        <div class="slot-cell" data-cell="3"></div>
        <div class="slot-cell" data-cell="4"></div>
        <div class="slot-cell" data-cell="5"></div>
        <div class="slot-cell" data-cell="6"></div>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="resTitle">通关！</h2>
      <p class="res-sub" id="resSub"></p>
      <div class="res-stats" id="resStats"></div>
      <div class="res-actions">
        <button class="btn primary" id="btnNext">下一关</button>
        <button class="btn" id="btnPoster">生成海报</button>
        <button class="btn ghost2" id="btnHome">回首页</button>
      </div>
    </div>
  </div>

  <!-- 海报 -->
  <div class="overlay" id="posterOverlay">
    <div class="poster-wrap">
      <img id="posterImg" alt="成绩海报">
      <p class="poster-tip">长按图片保存 · 或点下方按钮下载</p>
      <div class="res-actions">
        <a class="btn primary" id="btnDownload" download="guolegeguo.png">下载图片</a>
        <button class="btn ghost2" id="btnClosePoster">关闭</button>
      </div>
    </div>
  </div>

  <div id="flyLayer" aria-hidden="true"></div>
  <div id="toast" class="toast"></div>
</div>

<script defer src="js/util.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/geometry.js"></script>
<script defer src="js/generator.js"></script>
<script defer src="js/game.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
